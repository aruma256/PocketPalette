license="${mod_license}"
issueTrackerURL="https://github.com/aruma256/PocketPalette/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/aruma256/PocketPalette"
logoFile="assets/pocketpalette/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
