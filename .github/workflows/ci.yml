name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fabric
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Install Vulkan drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Run client game test
        run: ./gradlew runClientGameTest

      - name: Store test reports and client diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            fabric/build/reports/
            fabric/build/test-results/
            fabric/build/run/**/logs/
            fabric/build/run/**/crash-reports/
            fabric/build/run/**/screenshots/
